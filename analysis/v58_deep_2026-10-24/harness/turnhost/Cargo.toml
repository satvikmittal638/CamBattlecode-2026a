[package]
name = "turnhost"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = { version = "=49.0.2", features = ["call-hook"] }
wasmtime-environ = "=49.0.2"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
anyhow = "1"

[profile.release]
debug = false
